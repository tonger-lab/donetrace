name: Feature request
description: Suggest an idea for DoneTrace
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Please check existing issues and discussions first — an upvote on an existing idea helps more than a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or need. e.g. "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should DoneTrace do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds or other approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or links that help explain the idea.
