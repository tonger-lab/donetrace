name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you provide, the faster we can fix it.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which DoneTrace version are you using? (installer file name, or the app's About info)
      placeholder: e.g. 0.4.1 (Windows x64)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux (AppImage)
        - Linux (deb)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See the error ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, error messages, or anything else helpful. Please redact personal data (file paths, emails, API keys) before pasting.
